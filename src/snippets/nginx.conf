# An example of the HTTPS reverse proxy for the compose project, for nginx 1.25.1 or newer. Replace the two names and the certificate paths.
# There is no add_header here on purpose: the client and the API set their own security headers, and nginx passes them on.

server {
	listen 80;
	server_name app.example.com api.example.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name app.example.com;
	ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name api.example.com;
	ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	# nginx refuses a body over 1 MiB by default. The largest request of the API is an avatar of 10 MiB.
	client_max_body_size 12m;

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		# TRUSTED_PROXY_HOPS counts this entry.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Reads are streamed, and the API stops reading the storage when the browser has gone.
		proxy_buffering off;
	}
}
